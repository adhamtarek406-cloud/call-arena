<script type="text/plain" id="css-base">/* Tamara colour system — values transcribed verbatim from
   Tamara Visual Identity Guidelines 2025, pp. 27-29. */
:root{
  /* ---- Primary palette (purples) ---- */
  --tamara-lavender:#9600F1;      /* dominant brand colour, Pantone Violet C */
  --zingy-purple:#5300BA;         /* Pantone Violet 0631 C */
  --dreamy-lilac:#CEA4FF;         /* Pantone 7442 C */
  --light-lilac:#E5CFFF;          /* Pantone 531 C */

  /* ---- Secondary palette: 7 families x 5 steps (-2 darkest -> +2 lightest) ---- */
  --soft-grey-m2:#2A3051; --soft-grey-m1:#444C6D; --soft-grey:#707698; --soft-grey-p1:#E6E6F3; --soft-grey-p2:#F2F2FF;
  --sky-blue-m2:#170D75; --sky-blue-m1:#3716BA; --sky-blue:#5B22FF; --sky-blue-p1:#C7D2FF; --sky-blue-p2:#DCE4FF;
  --vibrant-pink-m2:#8C0072; --vibrant-pink-m1:#CB05A5; --vibrant-pink:#FF36B7; --vibrant-pink-p1:#FFCFF0; --vibrant-pink-p2:#FFE8F8;
  --cyan-m2:#10414C; --cyan-m1:#008989; --cyan:#00C9D3; --cyan-p1:#ACF5F5; --cyan-p2:#D2FCFC;
  --fresh-green-m2:#164922; --fresh-green-m1:#008419; --fresh-green:#1DD87E; --fresh-green-p1:#ACF1B4; --fresh-green-p2:#DAF8DD;
  --sand-m2:#5B3A22; --sand-m1:#985628; --sand:#FFB236; --sand-p1:#FFF4B8; --sand-p2:#FFF9D9;
  --sunset-m2:#7A1012; --sunset-m1:#C10000; --sunset:#FF4B16; --sunset-p1:#FDE3BB; --sunset-p2:#FFF1DA;

  /* ---- Neutrals ---- */
  --white:#FFFFFF;
  --black:#000000;

  /* ---- Semantic: surfaces ---- */
  --surface-page:var(--white);
  --surface-page-alt:var(--soft-grey-p2);
  --surface-card:var(--white);
  --surface-card-muted:var(--soft-grey-p1);
  --surface-brand:var(--tamara-lavender);
  --surface-brand-deep:var(--zingy-purple);
  --surface-brand-soft:var(--light-lilac);
  --surface-brand-softer:#F6EEFF;
  --surface-inverse:var(--soft-grey-m2);
  --surface-overlay:rgba(42,48,81,.55);

  /* ---- Semantic: text ---- */
  --text-primary:var(--soft-grey-m2);
  --text-body:var(--soft-grey-m1);
  --text-muted:var(--soft-grey);
  --text-on-brand:var(--white);
  --text-brand:var(--tamara-lavender);
  --text-link:var(--tamara-lavender);
  --text-link-hover:var(--zingy-purple);
  --text-inverse:var(--white);

  /* ---- Semantic: borders ---- */
  --border-subtle:var(--soft-grey-p1);
  --border-default:#D9DBE9;
  --border-strong:var(--soft-grey);
  --border-brand:var(--tamara-lavender);
  --border-focus:var(--sky-blue);

  /* ---- Semantic: status ---- */
  --success:var(--fresh-green-m1);      --success-surface:var(--fresh-green-p2);   --success-accent:var(--fresh-green);
  --warning:var(--sand-m1);             --warning-surface:var(--sand-p2);          --warning-accent:var(--sand);
  --danger:var(--sunset-m1);            --danger-surface:var(--sunset-p2);         --danger-accent:var(--sunset);
  --info:var(--sky-blue-m1);            --info-surface:var(--sky-blue-p2);         --info-accent:var(--sky-blue);
  --promo:var(--vibrant-pink-m1);       --promo-surface:var(--vibrant-pink-p2);    --promo-accent:var(--vibrant-pink);

  /* ---- Interaction states (see readme VISUAL FOUNDATIONS) ---- */
  --brand-hover:var(--zingy-purple);          /* lavender darkens on hover */
  --brand-active:#40008F;                     /* darker still on press */
  --ghost-hover:var(--surface-brand-softer);
  --ghost-active:var(--light-lilac);
  --state-disabled-surface:var(--soft-grey-p1);
  --state-disabled-text:#A2A7BD;
}
/* Tamara gradient — "crafted using colours from our secondary palette"
   (Guidelines pp. 22-24). Sampled from the master gradient artwork in
   assets/gradients/gradient-brand-large.png; use the artwork itself for
   large/hero surfaces and these tokens for UI-scale fills. */
:root{
  --gradient-stop-peach:#FFB382;
  --gradient-stop-butter:#FBE8A4;
  --gradient-stop-magenta:#DB5DC0;
  --gradient-stop-sky:#93D5F7;
  --gradient-stop-violet:#7E4EB2;

  /* Signature diagonal — warm top-left to violet bottom-right */
  --gradient-brand:linear-gradient(135deg,#FFB382 0%,#FBE8A4 26%,#F3D9E4 46%,#DB5DC0 68%,#7E4EB2 100%); /* @kind other */
  /* Horizontal bar version used on lockups and dividers */
  --gradient-brand-bar:linear-gradient(90deg,#FF986E 0%,#FBE6AF 34%,#F0DEEC 55%,#D461BC 78%,#9057B8 100%); /* @kind other */
  /* Soft mesh for large full-bleed backgrounds */
  --gradient-brand-mesh:radial-gradient(120% 100% at 0% 0%,#FFB382 0%,rgba(255,179,130,0) 55%),radial-gradient(110% 90% at 45% 8%,#FBE8A4 0%,rgba(251,232,164,0) 60%),radial-gradient(120% 110% at 100% 10%,#DB5DC0 0%,rgba(219,93,192,0) 62%),radial-gradient(120% 110% at 0% 100%,#93D5F7 0%,rgba(147,213,247,0) 60%),radial-gradient(130% 120% at 100% 100%,#7E4EB2 0%,rgba(126,78,178,0) 65%),#EADCF5; /* @kind other */
  /* Deep purple wash used behind app screens and hero photography */
  --gradient-purple-wash:linear-gradient(160deg,#9600F1 0%,#5300BA 100%); /* @kind other */
  /* Protection scrim for text over photography */
  --gradient-scrim:linear-gradient(180deg,rgba(42,48,81,0) 0%,rgba(42,48,81,.72) 100%); /* @kind other */
}
/* Tamara typography (Guidelines pp. 31-40) */
:root{
  /* Families. Display = Degular Display (substituted by Outfit).
     Body = Plus Jakarta Sans. Arabic display = GT America (substituted). */
  --font-display:"Outfit","Degular Display","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --font-arabic-display:"IBM Plex Sans Arabic","GT America",system-ui,sans-serif;
  --font-arabic-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;

  /* Weights — five available in both families */
  --fw-light:300; /* @kind font */ --fw-regular:400; /* @kind font */ --fw-medium:500; /* @kind font */ --fw-semibold:600; /* @kind font */ --fw-bold:700; /* @kind font */

  /* Type scale */
  --fs-display-xl:72px; --fs-display-lg:56px; --fs-display:44px;
  --fs-headline:34px;   --fs-title:26px;      --fs-subtitle:20px;
  --fs-body-lg:18px;    --fs-body:16px;       --fs-body-sm:14px;
  --fs-caption:12px;    --fs-micro:11px;

  /* Leading — "the larger the text, the tighter the tracking" */
  --lh-display:0.98; /* @kind font */ --lh-headline:1.08; /* @kind font */ --lh-title:1.2; /* @kind font */

.crit-t .hint{font-size:var(--fs-body-sm);color:var(--text-muted);margin-top:2px}
.crit-meta{display:flex;gap:8px;align-items:center;margin-top:8px}
.nabtn{border:0;background:transparent;color:var(--text-muted);font:var(--fw-medium) var(--fs-micro)/1 var(--font-body);padding:6px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--border-default)}
.nabtn[aria-pressed="true"]{background:var(--soft-grey-p1);color:var(--text-primary)}
.rate{display:inline-flex;gap:4px;padding:4px;background:var(--soft-grey-p1);border-radius:var(--radius-pill);max-width:100%}
.rate button{border:0;background:transparent;border-radius:var(--radius-pill);height:42px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font:var(--fw-semibold) var(--fs-body-sm)/1 var(--font-body);white-space:nowrap;cursor:pointer}
.rate button small{font-weight:var(--fw-medium);opacity:.7}
.rate button[aria-pressed="true"]{color:#fff;box-shadow:var(--shadow-xs)}
.rate button.r0[aria-pressed="true"]{background:var(--danger-accent)}
.rate button.r1[aria-pressed="true"]{background:var(--warning-accent)}
.rate button.r2[aria-pressed="true"]{background:var(--success-accent)}
@media (max-width:560px){.rate{width:100%}.rate button{flex:1;justify-content:center;padding:0 6px;height:46px;flex-direction:column;gap:2px;font-size:var(--fs-caption)}}
.chip.out{background:var(--surface-brand-soft);color:var(--zingy-purple)}

body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}</script>
<script type="text/plain" id="css-tv">
html,body{height:100%;margin:0}
body{background:var(--gradient-purple-wash);color:#fff;overflow:hidden}
body.idle{cursor:none}
.tv{box-sizing:border-box;height:100%;display:flex;flex-direction:column;padding:2.2vh 3.2vw;gap:1.6vh}
.top{display:flex;align-items:center;gap:2vw}
.top img{height:6vh;width:auto;display:block}
.top .live{display:inline-flex;align-items:center;gap:.8vh;font:var(--fw-semibold) 2vh/1 var(--font-body);letter-spacing:var(--ls-caption);text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:1.2vh 2vh}
.top .live i{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--fresh-green);animation:pulse 2s infinite}
.top .sp{flex:1}
.top .meta{font:var(--fw-medium) 2.4vh/1.2 var(--font-body);color:var(--light-lilac);text-align:end}
h1{font:var(--fw-bold) 5.6vh/1.05 var(--font-display);letter-spacing:var(--ls-display);margin:0;color:#fff}
[dir="rtl"] h1{font-family:var(--font-arabic-display)}
.sub{font:var(--fw-medium) 2.4vh/1.2 var(--font-body);color:var(--light-lilac)}
.now{display:flex;align-items:center;gap:2.4vw;background:#fff;color:var(--zingy-purple);border-radius:var(--radius-xl);padding:2vh 2.4vw;box-shadow:var(--shadow-lg)}
.now .tag{font:var(--fw-semibold) 2vh/1 var(--font-body);letter-spacing:var(--ls-caption);text-transform:uppercase;color:var(--text-muted)}
.now .nm{font:var(--fw-bold) 6vh/1.05 var(--font-display);letter-spacing:var(--ls-display)}
[dir="rtl"] .now .nm{font-family:var(--font-arabic-display)}
.now .chips{display:flex;gap:1vw;margin-top:1vh}
.now .chips span{background:var(--surface-brand-soft);color:var(--zingy-purple);border-radius:99px;padding:.8vh 1.6vh;font:var(--fw-semibold) 2vh/1 var(--font-body)}
.now .grow{flex:1;min-width:0}
.now .cnt{text-align:end}
.now .cnt b{display:block;font:var(--fw-bold) 7vh/1 var(--font-display);color:var(--tamara-lavender)}
.now .cnt span{font:var(--fw-medium) 2vh/1.2 var(--font-body);color:var(--text-muted)}
.rows{flex:1;display:grid;gap:1.1vh;min-height:0;grid-auto-rows:minmax(0,1fr);overflow:hidden}
.row{display:grid;grid-template-columns:7vh 1fr 11vh 22vh;align-items:center;gap:2vw;padding:0 2.4vw;background:rgba(255,255,255,.1);border-radius:var(--radius-xl);min-height:0;overflow:hidden}
.row .rk{font:var(--fw-bold) 3.4vh/1 var(--font-display);color:var(--light-lilac)}
.row .mid{min-width:0}
.row .nm{font:var(--fw-semibold) 3.4vh/1.15 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir="rtl"] .row .nm{font-family:var(--font-arabic-display)}
.row .bar{height:1.1vh;border-radius:99px;background:rgba(255,255,255,.18);margin-top:1vh;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--dreamy-lilac);border-radius:99px;transition:width var(--dur-page) var(--ease-out)}
.row .sc{font:var(--fw-bold) 5.2vh/1 var(--font-display);text-align:end;font-variant-numeric:tabular-nums}
.row .st{font:var(--fw-medium) 2vh/1.3 var(--font-body);color:var(--light-lilac);text-align:end}
.row.r1{background:#fff;color:var(--zingy-purple);box-shadow:var(--shadow-lg)}
.row.r1 .rk,.row.r1 .st{color:var(--text-muted)}
.row.r1 .bar{background:var(--surface-brand-soft)}
.row.r1 .bar i{background:var(--tamara-lavender)}
.row.r1 .sc{color:var(--tamara-lavender)}
.empty{flex:1;display:grid;place-items:center;text-align:center}
.empty h2{font:var(--fw-bold) 6vh/1.1 var(--font-display);margin:0 0 1.5vh;color:#fff}
.empty p{font:var(--fw-medium) 2.8vh/1.4 var(--font-body);color:var(--light-lilac);margin:0}
.foot{font:var(--fw-medium) 1.8vh/1 var(--font-body);color:var(--dreamy-lilac);display:flex;justify-content:space-between}
@keyframes pulse{70%{box-shadow:0 0 0 1.2vh rgba(29,216,126,0)}100%{box-shadow:0 0 0 0 rgba(29,216,126,0)}}
@media (prefers-reduced-motion:reduce){.top .live i{animation:none}}
</script>

<script type="text/plain" id="js-room">(function () {
'use strict';
var QA = window.QA, T = QA.T, esc = QA.esc, r1 = QA.r1, pct = QA.pct, TYPES = QA.TYPES, BENCH = QA.BENCH, SECTIONS = QA.SECTIONS;

var $ = function (id) { return document.getElementById(id); };
var S = null, notFound = false, tab = 'live';
var forms = {}, startSel = { pid: '', lob: '', dir: 'in', preset: 'all', custom: null }, trainerScoring = false, shownKey = '';
var ALL = QA.DEF.map(function (c) { return c.id; });
var SHORT = ['c11', 'c13', 'c21', 'c22', 'c25', 'c31', 'c32', 'c35', 'c41', 'c42'];

/* ---------- session ---------- */
function sess() { try { return JSON.parse(localStorage.getItem('arena-t-' + CODE) || 'null'); } catch (e) { return null; } }
function setSess(o) { try { localStorage.setItem('arena-t-' + CODE, JSON.stringify(o)); } catch (e) {} }
(function adoptTrainerLink() {
  var m = (location.hash || '').match(/^#t=([0-9a-f]+)$/);
  if (m) { setSess({ role: 'trainer', token: m[1] }); history.replaceState(null, '', location.pathname + location.search); }
})();
function token() { var s = sess(); return s ? s.token : ''; }
function toast(m) { var h = $('toasthost'); h.innerHTML = '<div class="toast" role="status">' + esc(m) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(function () { h.innerHTML = ''; }, 3200); }
function api(method, url, body) {
  return fetch(QA.api + '/api/rooms/' + CODE + url, { method: method, headers: { 'Content-Type': 'application/json', 'X-Token': token() }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
}

function load() {
  return api('GET', '').then(function (d) { S = d; notFound = false; refresh(); }).catch(function (e) { if (/not found/i.test(e.message)) { notFound = true; render(); } });
}

/* ---------- helpers ---------- */
function lobName(id) { var l = S.room.lobs.find(function (x) { return x.id === id; }); return l ? T(l.name) : T('Unassigned'); }
function dirLabel(d) { return d === 'in' ? T('Inbound') : T('Outbound'); }
function typeLabel(k) { return T(TYPES[k]); }
function openTurn() { return S.turns.find(function (t) { return t.status === 'open'; }) || null; }

}
function critName(id) { var c = QA.DEF.find(function (x) { return x.id === id; }); return c ? T(c.n) : id; }

/* ---------- scorecard: three choices per criterion (Missed 0 / Needs work half / Perfect full) ---------- */
function getForm(turn) {

    var m = turn.mine, rate = {};
    if (m && m.checked) Object.keys(m.checked).forEach(function (k) { var v = m.checked[k]; if (v === 0 || v === 1 || v === 2) rate[k] = v; });
    f = forms[turn.id] = { rate: rate, na: {}, note: m ? (m.note || '') : '' };
    ((m && m.na) || []).forEach(function (x) { f.na[x] = true; });
  }
  return f;
}
function evalTurn(turn) {
  var f = getForm(turn), crits = critOf(turn), earn = 0, tot = 0, fails = [], ev = [], cats = { CC: false, EC: false, BC: false }, done = 0, need = 0;
  crits.forEach(function (c) {
    if (f.na[c.id]) return;
    ev.push(c.id); tot += c.w; need++;
    var v = f.rate[c.id];
    if (v === 0 || v === 1 || v === 2) { done++; earn += c.w * v / 2; }
    if (v === 0) { fails.push(c.id); if (c.type !== 'NC') cats[c.type] = true; }
  });
  return { score: tot ? earn / tot * 100 : 0, pass: !(cats.CC || cats.EC || cats.BC), fails: fails, ev: ev, cats: cats, crits: crits, done: done, need: need, complete: need > 0 && done === need };
}
function pts(n) { return String(Math.round(n * 100) / 100); }
function hintOf(c, turn) { return turn.dir === 'out' && c.ho ? c.ho : c.h; }

  var v = f.rate[c.id], na = !!f.na[c.id];
  var h = '<div class="crit' + (v === 0 ? ' failed' : '') + (na ? ' isna' : '') + '" data-crit="' + c.id + '"><div class="crit-main"><div class="crit-t"><div class="nm">' + esc(T(c.n)) + '</div>' + (hintOf(c, turn) ? '<div class="hint">' + esc(T(hintOf(c, turn))) + '</div>' : '') + '<div class="crit-meta"><span class="chip ' + c.type.toLowerCase() + '">' + typeLabel(c.type) + '</span>' + (turn.dir === 'out' && c.ho ? '<span class="chip out">' + T('Outbound adds') + '</span>' : '') + '<button type="button" class="nabtn" data-na="' + c.id + '" aria-pressed="' + na + '">' + T('N/A') + '</button></div></div>';
  if (!na) {
    h += '<div class="rate" role="group" aria-label="' + esc(T(c.n)) + '">';
    [[0, 'Missed', 0], [1, 'Needs work', c.w / 2], [2, 'Perfect', c.w]].forEach(function (o) {
      h += '<button type="button" class="r' + o[0] + '" data-r="' + c.id + '" data-v="' + o[0] + '" aria-pressed="' + (v === o[0]) + '"><span>' + T(o[1]) + '</span><small class="num">' + pts(o[2]) + '</small></button>';
    });
    h += '</div>';
  }

}
function scorecardHtml(turn) {

  SECTIONS.forEach(function (s) {
    var cs = e.crits.filter(function (c) { return c.sec === s.id; }); if (!cs.length) return;
    h += '<div class="secbar"><h3>' + esc(T(s.name)) + '</h3></div><div class="stack">';

    h += '</div>';

  return h + '</div><div class="card" style="margin-top:24px"><span class="lbl">' + T('Coaching note (optional)') + '</span><textarea id="sc-note" placeholder="' + T('What to coach on next') + '">' + esc(f.note) + '</textarea></div>';
}
function headHtml(e) {

}
function bindScorecard(turn) {
  var f = getForm(turn);
  function dock() {
    var e = evalTurn(turn), why = [];['CC', 'EC', 'BC'].forEach(function (k) { if (e.cats[k]) why.push(typeLabel(k)); });

  }
  wire(); dock();
  var n = $('sc-note'); if (n) n.oninput = function () { f.note = n.value; };

}

/* ---------- live tab ---------- */
function shareBox() {
  var h = '<div class="sharebox"><div><span class="lbl" style="margin:0">' + T('Room code') + '</span><div class="code">' + CODE + '</div></div><div class="url"><span class="lbl" style="margin:0">' + T('Link for trainees') + '</span>' + esc(joinUrl()) + '</div><button class="btn small" id="cp-join" type="button">' + T('Copy link') + '</button><a class="btn small" href="' + QA.tvUrl(CODE) + '" target="_blank" rel="noopener">' + T('Open TV screen') + '</a><button class="btn small" id="cp-trainer" type="button">' + T('Copy trainer link') + '</button></div>';
  return h;
}

    h += '<span class="person' + cls + '">' + esc(p.name) + ' <small class="num">' + p.turns + '</small><button type="button" data-rm="' + p.id + '" aria-label="' + T('Remove') + '">×</button></span>';
  });
  return h + '</div>';
}
function trainerLive() {

    h += '<div class="stage"><span class="lbl">' + T('Now on') + '</span><div class="who">' + esc(t.pname) + '</div><div class="chips"><span class="chip">' + esc(lobName(t.lob)) + '</span><span class="chip">' + dirLabel(t.dir) + '</span><span class="chip">' + T('{n} criteria', { n: critOf(t).length }) + '</span></div><div class="prog"><i style="width:' + (exp ? Math.min(100, got / exp * 100) : 0) + '%"></i></div><span class="lbl">' + T('{a} of {b} scores in', { a: got, b: exp }) + '</span>';

    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="t-close" type="button">' + T('Close and reveal') + '</button><button class="btn ghost" id="t-score" type="button">' + (trainerScoring ? T('Hide my scorecard') : T('Score it myself')) + '</button><button class="btn ghost" id="t-cancel" type="button">' + T('Cancel this turn') + '</button></div></div>';

function suggested() {

  return ps.length ? ps[0].id : '';
}
function startForm() {

  gl.forEach(function (a) { h += '<tr><td>' + esc(lobName(a.lob)) + '</td><td>' + dirLabel(a.dir) + '</td><td class="r num">' + a.n + '</td><td class="r num">' + r1(a.s / a.n) + '</td><td class="r num">' + pct(a.p / a.n * 100) + '</td></tr>'; });
